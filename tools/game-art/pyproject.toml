[project]
name = "crforge-art"
version = "0.1.0"
description = "Builds crforge's realistic-render art cache from the game files of an existing Clash Royale installation"
requires-python = ">=3.11"
dependencies = ["flatbuffers>=24", "zstandard>=0.22", "texture2ddecoder>=1.0.5", "numpy>=1.26", "pillow>=10", "fsb5>=1.0"]

[project.scripts]
crforge-art = "crforge_art.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crforge_art"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
